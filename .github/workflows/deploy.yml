name: Deploy

# main 上有提交就构建、预渲染并部署到 Cloudflare Pages（项目 oink-ui）。
# 需要在仓库的 Settings → Secrets and variables → Actions 里配置：
#   CLOUDFLARE_API_TOKEN   带 “Cloudflare Pages: Edit” 权限的 API token
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare 账号 ID
# .asset-archive 用 actions/cache 在两次部署之间保留：部署前打开的标签页还能加载到旧的代码块（见 scripts/keep-assets.mjs）。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Restore asset archive
        uses: actions/cache@v4
        with:
          path: .asset-archive
          key: asset-archive-${{ github.run_id }}
          restore-keys: asset-archive-
      - run: node scripts/keep-assets.mjs
      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name oink-ui --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
