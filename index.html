<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Oink UI</title>
  <!--head-->
  <!-- 语言：没手动选过时按浏览器语言来，中文看中文版（/zh 前缀），其它语言都看英文版（根路径）；选过就按选的。
       嵌在首页里的示例（?embed）和搜索引擎爬虫不跳。旧的 #/ 地址也在这里换成新地址 -->
  <script>(function(){var l=location,p=l.pathname,h=l.hash;if(h.indexOf('#/')===0){p=h.slice(1);h=''}var zh=/^\/zh(\/|$)/.test(p),w=null;try{w=localStorage.getItem('oink-lang')}catch(e){}if(w!=='zh'&&w!=='en'){if(/bot|crawl|spider|slurp|preview/i.test(navigator.userAgent)||/[?&]embed\b/.test(l.search))w=zh?'zh':'en';else w=String((navigator.languages&&navigator.languages[0])||navigator.language||'').toLowerCase().indexOf('zh')===0?'zh':'en'}var t=w==='zh'?(zh?p:'/zh'+(p==='/'?'':p)):(zh?(p.replace(/^\/zh/,'')||'/'):p);if(t!==l.pathname||h!==l.hash)l.replace(t+l.search+h)})()</script>
  <!-- 首帧之前定好主题、强调色（自定义颜色直接套用存好的变量）：预渲染的 HTML 一出来颜色就对，不闪 -->
  <script>(function(){var d=document.documentElement,s={};try{s=JSON.parse(localStorage.getItem('oink-site')||'{}')||{}}catch(e){}var t=s.theme==='light'||s.theme==='dark'?s.theme:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');d.setAttribute('data-theme',t);d.style.colorScheme=t;var a=s.accent||'';if(a.charAt(0)==='#'&&s.vars){d.setAttribute('data-accent','custom');for(var k in s.vars)d.style.setProperty(k,s.vars[k])}else d.setAttribute('data-accent',/^(pink|orange|amber|blue|violet)$/.test(a)?a:'pink');if(s.motion==='full'||s.motion==='reduced')d.setAttribute('data-motion',s.motion);if(/[?&]embed\b/.test(location.search))d.setAttribute('data-embed','');})()</script>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cstyle%3E.i%7Bfill:%231B1C22%7D%40media %28prefers-color-scheme:dark%29%7B.i%7Bfill:%23F4F4F6%7D%7D%3C/style%3E%3Cg transform='rotate%28-8 16 16%29'%3E%3Cpath class='i' d='M10 3H18A7 7 0 0 1 25 10V18A7 7 0 0 1 18 25H5A2 2 0 0 1 3 23V10A7 7 0 0 1 10 3Z'/%3E%3Crect x='15.5' y='15' width='13.5' height='10' rx='5' fill='%23FF6B8E'/%3E%3Cellipse class='i' cx='20' cy='20' rx='1.3' ry='1.9'/%3E%3Cellipse class='i' cx='24.5' cy='20' rx='1.3' ry='1.9'/%3E%3C/g%3E%3C/svg%3E">
</head>
<body>
  <div id="root"><!--app--></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
